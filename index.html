<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Student Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            color: #00f2ff;
            background: linear-gradient(-45deg, #050505, #0a0a20, #150015, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-align: center;
            text-shadow: 0 0 10px #00f2ff, 0 0 20px #0066ff;
            font-size: 3rem;
        }

        #students-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00f2ff;
            border-radius: 15px;
            width: 220px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 30px #00f2ff;
            border-color: #ff00ff;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .nickname {
            color: #ff00ff;
            font-style: italic;
            text-shadow: 0 0 5px #ff00ff;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #0a0a0a;
            margin: 10vh auto;
            padding: 30px;
            border: 3px solid #ff00ff;
            border-radius: 20px;
            max-width: 400px;
            text-align: center;
            color: white;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 30px;
            cursor: pointer;
        }

        #modal-img {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #00f2ff;
        }
    </style>
</head>
<body>

    <h1>Students</h1>

    <div id="students-container">
        <p>Načítavam neónové dáta...</p>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="foto">
            <h2 id="modal-name"></h2>
            <p class="nickname" id="modal-nick"></p>
            <p id="modal-desc"></p>
        </div>
    </div>

    <script>
        // TU DOPÍŠ SVOJU ADRESU Z RENDRA
        const API_URL = "https://tudenti.onrender.com"; 

        async function fetchStudents() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const container = document.getElementById("students-container");
                container.innerHTML = "";

                // Ošetrenie, ak by backend poslal objekt namiesto poľa
                const students = Array.isArray(data) ? data : data.students;

                students.forEach(s => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${s.image}" alt="foto">
                        <h3>${s.name} ${s.surname}</h3>
                        <p class="nickname">"${s.nickname}"</p>
                    `;
                    card.onclick = () => showModal(s);
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById("students-container").innerHTML = 
                    `<p style="color:red">Chyba: ${err.message}</p>`;
            }
        }

        function showModal(s) {
            document.getElementById("modal-img").src = s.image;
            document.getElementById("modal-name").innerText = `${s.name} ${s.surname}`;
            document.getElementById("modal-nick").innerText = `"${s.nickname}"`;
            document.getElementById("modal-desc").innerText = s.bio;
            document.getElementById("myModal").style.display = "block";
        }

        document.querySelector(".close-btn").onclick = () => {
            document.getElementById("myModal").style.display = "none";
        };

        window.onclick = (e) => {
            if (e.target.className == "modal") document.getElementById("myModal").style.display = "none";
        };

        fetchStudents();
    </script>
</body>
</html>
