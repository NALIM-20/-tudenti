<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Student Dashboard | Live Data</title>
    <style>
        /* Ponechal som tvoj štýl, je výborný */
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #00f2ff;
            background: linear-gradient(-45deg, #050505, #0a0a20, #150015, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-align: center;
            font-size: clamp(24px, 5vw, 42px);
            text-shadow: 0 0 10px #00f2ff, 0 0 20px #0066ff;
            margin-bottom: 30px;
        }

        #students-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00f2ff;
            border-radius: 15px;
            width: 220px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 30px #00f2ff;
            border-color: #ff00ff;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .nickname {
            color: #ff00ff;
            font-style: italic;
            text-shadow: 0 0 5px #ff00ff;
            margin: 5px 0;
        }

        /* MODAL ŠTÝLY */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #0a0a0a;
            margin: 10vh auto;
            padding: 25px;
            border: 3px solid #ff00ff;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.5);
        }

        .close-btn {
            float: right;
            font-size: 30px;
            cursor: pointer;
            color: #fff;
        }

        #modal-img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #00f2ff;
        }
    </style>
</head>
<body>

    <h1>👨‍💻 Live Neon Students</h1>

    <div id="students-container">
        <p class="loading">Pripájanie k SQL databáze na Renderi...</p>
    </div>

    <!-- MODAL -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="foto">
            <h2 id="modal-name"></h2>
            <p class="nickname" id="modal-nick"></p>
            <p id="modal-desc" style="color: #eee;"></p>
        </div>
    </div>

    <script>
        const container = document.getElementById("students-container");
        const modal = document.getElementById("myModal");
        const closeBtn = document.querySelector(".close-btn");

        // SEM DAJ SVOJU URL Z RENDRA
        const API_URL = "https://tudenti.onrender.com"; 

        async function loadStudents() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Nepodarilo sa načítať dáta.");

                const students = await response.json();
                container.innerHTML = "";

                students.forEach(student => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${student.image}" alt="${student.name}">
                        <h3>${student.name} ${student.surname}</h3>
                        <p class="nickname">"${student.nickname}"</p>
                    `;
                    
                    card.onclick = () => {
                        document.getElementById("modal-img").src = student.image;
                        document.getElementById("modal-name").innerText = `${student.name} ${student.surname}`;
                        document.getElementById("modal-nick").innerText = `"${student.nickname}"`;
                        document.getElementById("modal-desc").innerText = student.bio;
                        modal.style.display = "block";
                    };
                    
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<p style="color:red">Chyba: ${error.message}<br>Skontroluj, či ti beží backend!</p>`;
            }
        }

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

        loadStudents();
    </script>
</body>
</html>
